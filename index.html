@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1526;--card:#16203a;--ink:#e8edf8;--mut:#8f9cb8;--line:#27345a;--blue:#6c93ff;--red:#ff6b78;--ok:#3fcf9e}}
:root[data-theme="dark"]{--bg:#0e1526;--card:#16203a;--ink:#e8edf8;--mut:#8f9cb8;--line:#27345a;--blue:#6c93ff;--red:#ff6b78;--ok:#3fcf9e}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:3px solid var(--blue);background:var(--card)}
header h1{font-size:17px;margin:0;font-weight:800}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav.sub{background:none;border:0;padding:0 0 12px}
nav button{flex:none;border:1px solid var(--line);background:none;color:var(--ink);padding:8px 14px;border-radius:20px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{padding:14px;max-width:760px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.s small,label,.mut{color:var(--mut)}.s b{display:block;font-size:20px;margin-top:4px;font-weight:800}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.box h2{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:11px;font-family:inherit;color:var(--ink);cursor:pointer}
.tile.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
label{display:block;margin:10px 0 4px;font-size:12px}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
.hd,.row,.ch{display:flex;align-items:center;gap:10px}
.hd h2{margin:0}
.ch{justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.ch:last-child{border:0}
.b{border:0;border-radius:8px;padding:8px 12px;color:#fff;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;margin:6px 6px 0 0}
.neu{background:var(--blue)}.no2{background:var(--mut)}.no{background:var(--red)}.ok{background:var(--ok)}
.empty{color:var(--mut);padding:14px 0;text-align:center}
.pill{display:inline-block;background:var(--blue);color:#fff;border-radius:20px;padding:10px 16px;font-weight:600;margin-top:6px}
.note{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;color:var(--mut)}
header h1{font-size:18px}.htl{flex:1;min-width:0}.htl small{display:block;color:var(--mut);font-size:13px}
#hr{display:flex;align-items:center;gap:6px}
.ib{position:relative;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px}
.bg{position:absolute;top:-2px;right:-4px;background:var(--blue);color:#fff;border-radius:12px;font-size:11px;font-weight:700;padding:2px 6px}
.av{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff}
.lb{width:64px;height:64px;border:1px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;background:#fff;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.svc{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 18px 12px 12px;margin-bottom:12px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.gr{color:var(--ok);font-weight:600}.chev{font-size:30px;color:var(--mut)}
.cc{border-radius:26px;padding:16px}
.bal{background:linear-gradient(135deg,#1553f0,#2b7bff);color:#fff;border-radius:24px;padding:20px;margin-top:14px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(21,83,240,.28)}
.fl{width:56px;height:56px;object-fit:contain;flex:none}.dpb{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.25);flex:none}
.bn{font-size:34px;font-weight:800;line-height:1.15;margin-top:6px;white-space:nowrap}.bl{font-size:13px;letter-spacing:.12em;opacity:.92}
.vm{background:none;border:0;border-bottom:2px solid rgba(255,255,255,.65);color:#fff;opacity:.92;font-weight:400;font-size:13px;letter-spacing:0;font-family:inherit;cursor:pointer;padding:0 0 2px}
.bal.nc{background:var(--card);color:var(--ink);text-shadow:none;box-shadow:none;border:1px solid var(--line);min-height:0}.bal.nc .vm{color:var(--ink);border-bottom-color:var(--ink)}
.vm2{background:none;border:0;color:var(--ink);font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
.actb{background:rgba(18,128,92,.14);color:var(--ok);border:1px solid var(--ok);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.trend{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:50%;background:rgba(18,128,92,.15);color:var(--ok);display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:9px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.bal{text-shadow:0 1px 8px rgba(0,0,0,.3)}
.bal.ht{background:linear-gradient(180deg,#00209F 0 56%,#D21034 56% 100%);box-shadow:0 10px 24px rgba(0,32,159,.3)}
.bal.mx{background:linear-gradient(180deg,#006847 0 52%,#fff 52% 60%,#CE1126 60% 100%);box-shadow:0 10px 24px rgba(0,104,71,.3)}
.bal.cl{background:linear-gradient(180deg,#0039A6 0 56%,#fff 56% 58.5%,#D52B1E 58.5% 100%);box-shadow:0 10px 24px rgba(0,57,166,.3)}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;padding:24px;color:#000;background:#fff}}
#mb{background:none;border:0;font-size:24px;color:var(--ink);cursor:pointer;padding:0 4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9}
.dr{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:310px;background:var(--card);z-index:10;display:flex;flex-direction:column;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
.it{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:24px;border:0;background:none;color:var(--ink);font-family:inherit;font-size:15px;width:100%;text-align:left;cursor:pointer}
.it.on{background:rgba(29,79,215,.13);color:var(--blue);font-weight:600}
.sec{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;letter-spacing:.1em;font-weight:600;padding:18px 12px 6px;background:none;border:0;width:100%;font-family:inherit;cursor:pointer}
.ln{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
</style>

<style id="ftauth-style">
#ftauth-overlay,#ftauth-overlay *{box-sizing:border-box}
#ftauth-overlay{position:fixed;inset:0;z-index:2147483000;background:#0046d9;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:clamp(16px,4vw,36px);overflow:auto;font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
#ftauth-overlay.fw{padding:0;align-items:flex-start;justify-content:center}
#ftauth-overlay.fw #ftauth-welcome{display:flex}
#ftauth-overlay.fw #ftauth-card{display:none}
#ftauth-welcome{display:none;width:min(100%,520px);margin:0 auto;min-height:100dvh;flex-direction:column;justify-content:center;color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 0 calc(20px + env(safe-area-inset-bottom,0px))}
.fw-hero{position:relative;width:min(70%,290px);aspect-ratio:720/830;flex:0 0 auto;overflow:hidden;margin:0 auto 22px;border-radius:22px;box-shadow:0 14px 34px rgba(0,0,0,.28);background:rgba(255,255,255,.08)}
.fw-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .8s}
.fw-hero img.on{opacity:1}
.fw-body{padding:0 22px 26px;text-align:center}
.fw-dots{display:flex;gap:7px;justify-content:center;margin:0 0 14px}
.fw-dots i{display:block;width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.4);transition:all .3s;cursor:pointer}
.fw-dots i.on{width:22px;background:#fff}
.fw-h{font-size:clamp(30px,9vw,42px);line-height:1.08;font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
.fw-p{font-size:clamp(15px,4.2vw,19px);line-height:1.45;margin:0 auto 22px;max-width:380px;opacity:.95}
.fw-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fw-btns button{min-height:54px;border-radius:99px;font:700 17px/1 inherit;font-family:inherit;cursor:pointer;border:2px solid #fff;background:transparent;color:#fff}
.fw-btns button.p{background:#fff;color:#0a3bd0}
#ftauth-card{background:transparent;border:0;box-shadow:none;width:min(100%,420px);padding:8px 20px 24px;margin:auto}
.ftauth-back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;width:42px;height:42px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.16);border:0;color:#fff;cursor:pointer;z-index:5}
.ftauth-back:active{background:rgba(255,255,255,.3)}
.ft-auth-head{text-align:center;margin:6px 0 14px;color:#fff}
.ft-auth-head .ft-auth-title{font-size:24px;font-weight:800;letter-spacing:-.01em}
.ft-auth-head .ft-auth-sub{font-size:13px;opacity:.85;margin-top:3px}
.ftauth-label{display:block;color:#fff;font-size:13px;font-weight:600;margin:12px 0 6px}
.ftauth-input{width:100%;height:50px;border-radius:14px;background:#fff;color:#10224f;border:2px solid transparent;padding:0 16px;font:15px inherit;font-family:inherit;box-sizing:border-box;outline:none}
.ftauth-input:focus{border-color:#9fe870;box-shadow:none}
.ftauth-input::placeholder{color:#7a86a6}
.ftauth-btn{width:100%;min-height:50px;margin-top:18px;border:0;border-radius:99px;background:#fff;color:#0a3bd0;font:700 16px/1 inherit;font-family:inherit;cursor:pointer}
.ftauth-btn:disabled{opacity:.6;cursor:default}
.ftauth-link{display:block;margin:14px auto 0;background:none;border:0;color:#fff;font:600 14px inherit;font-family:inherit;cursor:pointer;padding:4px;text-align:center}
.ftauth-note{font-size:13.5px;line-height:1.4;margin-top:12px;text-align:center;word-break:break-word}
.ftauth-note.ok{color:#bff5d8}.ftauth-note.err{color:#ffd0d4}
.fe-wrap{position:relative;display:block}.fe-wrap .ftauth-input{padding-right:48px}
.fe-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:#5b6b92;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
.fe-btn:active{background:#e8eefc}.fe-btn svg{width:22px;height:22px}
#ftauth-card .ft-auth-msg{padding:20px 0;text-align:center;font-size:14px;line-height:1.55;color:#fff}
@media(max-width:520px){#ftauth-overlay{align-items:center;justify-content:center;padding:14px}#ftauth-overlay.fw{padding:0}#ftauth-card{padding:8px 6px 20px}}
@media(max-height:650px){#ftauth-overlay{align-items:flex-start}#ftauth-card{margin-top:56px;margin-bottom:12px}}
@media(max-height:700px){.fw-hero{width:min(46%,200px);margin-bottom:14px}.fw-body{padding-bottom:16px}.fw-h{font-size:clamp(24px,7vw,32px);margin-bottom:8px}.fw-p{font-size:clamp(14px,3.6vw,16px);margin-bottom:14px}.fw-btns button{min-height:48px}}
@media(prefers-reduced-motion:reduce){.fw-hero img{transition:none}}
</style>

function regErr(e){
var m=e?(e.message||e.msg||e.error_description||""):"";
var c=e&&e.code?String(e.code):"";
var l=String(m).toLowerCase();
if(l.indexOf("password")>=0&&(l.indexOf("short")>=0||l.indexOf("min")>=0||l.indexOf("weak")>=0||l.indexOf("valid")>=0||l.indexOf("at least")>=0||l.indexOf("character")>=0))return t("npmin")+(m?" ("+m+")":"");
if(c.indexOf("user_already_exists")>=0||l.indexOf("already")>=0||l.indexOf("exists")>=0)return t("uexists")+(m?" ("+m+")":"");
if(l.indexOf("not confirmed")>=0||(l.indexOf("confirm")>=0&&l.indexOf("email")>=0))return t("enoconf")+(m?" ("+m+")":"");
if(c.indexOf("rate")>=0||l.indexOf("rate limit")>=0)return t("err_limit")+(m?" ("+m+")":"");
return (c?c+": ":"")+m||t("fncerr");
}

  authBusy=false;
}

function dvBoot(){
  if(!dev||typeof dev!="object")dev={c:[],n:0};
  if(!Array.isArray(dev.c))dev.c=[];
  if(!sec||typeof sec!="object")sec={};
  if(!Array.isArray(sec.aud))sec.aud=[];
  if(!Array.isArray(sec.al))sec.al=[];
  if(!sec.ck||typeof sec.ck!="object")sec.ck={};
  if(!sec.lim||typeof sec.lim!="object")sec.lim={rc:0,rt:0,d:0};
  if(typeof sec.pin!="string")sec.pin="";
  dev.c.forEach(function(c){
    if(!c)return;
    c.mv=Array.isArray(c.mv)?c.mv:[];
    c.sv=Array.isArray(c.sv)?c.sv:[];
    c.sh=+c.sh||0;c.sx=+c.sx||0;c.db=+c.db||0;
  });
}
function dvNow(){return new Date().toISOString().slice(0,16).replace("T"," ")}
function dvG(id){for(var i=0;i<dev.c.length;i++)if(String(dev.c[i].id)==String(id))return dev.c[i];return null}
function dvRate(c){var cu=(c&&c.cu)||"CLP";if(cu=="CLP")return 1;var r=+cr[cu]||0;return r>0?r:0}
function dvMn(c,x){x=+x||0;var cu=(c&&c.cu)||"CLP",r=dvRate(c);if(cu!="CLP"&&r>0)return nf(Math.round(x/r*100)/100)+" "+cu;return nf(x)+" CLP"}
function dvTot(c){return(+c.sh||0)+(+c.sx||0)}
function dvGrp(k){return(k=="moncash"||k=="natcash"||k=="topup")?"sh":"sx"}
function dvWn(w){return w=="sx"?t("devWallet2"):t("devWallet1")}
function dvOk(c,k){return k=="act"?!c.bl:k=="blk"?!!c.bl:k=="deb"?(+c.db||0)>0:true}
function dvDayOut(){var td=dvNow().slice(0,10),s=0;dev.c.forEach(function(c){(c.mv||[]).forEach(function(m){if(m.ty=="rt"&&String(m.d||"").slice(0,10)==td)s+=+m.a||0})});return s}

  secAud("Venta de servicio",c.n+" · "+SV[k].n+" · "+nf(clp)+" CLP");

async function dvRc(id){
  var c=dvG(id);if(!c)return;
  var v=parseFloat((document.getElementById("dvra")||{}).value||0);
  if(!(v>0)){msg=t("err1");draw();return}
  var r=dvRate(c),clp=Math.round(v*r);
  if(!(clp>0)){msg=t("devRateBad");draw();return}
  var w=(document.getElementById("dvrw")||{}).value=="sx"?"sx":"sh";
  var pool=w=="sx"?virt2:virt;
  if(clp>pool){msg=t("devNoFunds");draw();return}
  if(+sec.lim.rc>0&&clp>+sec.lim.rc){msg=t("secLimHit");draw();return}
  if(!(await dvPin("dvpin")))return;
  if(w=="sx")virt2-=clp;else virt-=clp;
  var pd=Math.min(+c.db||0,clp);
  c.db=(+c.db||0)-pd;c[w]=(+c[w]||0)+clp-pd;
  c.mv.unshift({ty:"rc",a:clp,tx:t("rch")+" · "+dvWn(w)+(pd?' · '+t("debt")+' -'+nf(pd):''),d:dvNow(),s:dvTot(c)});
  secAud("Recarga a cliente",c.n+" · "+nf(clp)+" CLP");
  msg=t("devSaved");persist();draw();top0();
}

async function dvRt(id){
  var c=dvG(id);if(!c)return;
  if(c.bl){msg=t("blkd");draw();return}
  var v=parseFloat((document.getElementById("dvta")||{}).value||0);
  if(!(v>0)){msg=t("err1");draw();return}
  var r=dvRate(c),clp=Math.round(v*r);
  if(!(clp>0)){msg=t("devRateBad");draw();return}
  var w=(document.getElementById("dvrw2")||{}).value=="sx"?"sx":"sh";
  if(clp>(+c[w]||0)){msg=t("devInsufficient");draw();return}
  if(+sec.lim.rt>0&&clp>+sec.lim.rt){msg=t("secLimHit");draw();return}
  if(+sec.lim.d>0&&dvDayOut()+clp>+sec.lim.d){msg=t("secLimHit");draw();return}
  if(!(await dvPin("dvpin2")))return;
  c[w]=(+c[w]||0)-clp;
  if(w=="sx")virt2+=clp;else virt+=clp;
  c.mv.unshift({ty:"rt",a:clp,tx:t("rtr")+" · "+dvWn(w),d:dvNow(),s:dvTot(c)});
  secAud("Retiro de cliente",c.n+" · "+nf(clp)+" CLP");
  msg=t("devSaved");persist();draw();top0();
}

function rpTy(ty){

function rpSet(k,v){rpD[k]=v;draw()}
function rpClr(){rpD={u:"all",ty:"all",f:"",to:"",q:""};draw()}

function rpRows(){
  var list=[];
  (ops||[]).forEach(function(o){
    if(!o||o.st=="r")return;
    list.push({d:String(o.date||"").slice(0,10),cl:srcName(o.src)||"",ty:"op",tx:(SV[o.s]?SV[o.s].n:o.s)+" #"+o.n,a:+o.tot||0});
  });
  (dev.c||[]).forEach(function(c){(c.mv||[]).forEach(function(m){
    list.push({d:String(m.d||"").slice(0,10),cl:c.n||"",ty:m.ty,tx:m.tx||"",a:+m.a||0});
  })});
  (log||[]).forEach(function(e){
    if(!e||e.ty=="old")return;
    list.push({d:String(e.d||"").slice(0,10),cl:srcName(e.fr)||"",ty:e.ty,tx:e.lb||e.tx||"",a:+e.amt||0});
  });
  var q=String(rpD.q||"").toLowerCase();
  return list.filter(function(x){
    if(rpD.u!="all"&&x.cl!=rpD.u)return false;
    if(rpD.ty!="all"&&x.ty!=rpD.ty)return false;
    if(rpD.f&&x.d&&x.d<rpD.f)return false;
    if(rpD.to&&x.d&&x.d>rpD.to)return false;
    if(q&&((x.cl+" "+x.tx+" "+x.d+" "+rpTy(x.ty)).toLowerCase().indexOf(q)<0))return false;
    return true;
  }).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});
}
function rpSum(rows){
  var s={op:0,rc:0,rt:0,sl:0,n:rows.length};
  rows.forEach(function(x){if(s[x.ty]!=null)s[x.ty]+=+x.a||0});
  return s;
}
function rpRank(rows){
  var m={};rows.forEach(function(x){
    if(x.ty!="op"&&x.ty!="sl")return;
    if(!x.cl)return;
    var r=m[x.cl]||(m[x.cl]={n:x.cl,v:0,c:0});
    r.v+=+x.a||0;r.c++;
  });
  var a=Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return y.v-x.v||y.c-x.c});
  if(!a.length)return "";
