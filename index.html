<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel Administratè</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#12213f;--mut:#6b7893;--line:#dbe2ee;--blue:#1d4fd7;--red:#d62839;--ok:#12805c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1526;--card:#16203a;--ink:#e8edf8;--mut:#8f9cb8;--line:#27345a;--blue:#6c93ff;--red:#ff6b78;--ok:#3fcf9e}}
:root[data-theme="dark"]{--bg:#0e1526;--card:#16203a;--ink:#e8edf8;--mut:#8f9cb8;--line:#27345a;--blue:#6c93ff;--red:#ff6b78;--ok:#3fcf9e}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:3px solid var(--blue);background:var(--card)}
header h1{font-size:17px;margin:0;font-weight:800}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav.sub{background:none;border:0;padding:0 0 12px}
nav button{flex:none;border:1px solid var(--line);background:none;color:var(--ink);padding:8px 14px;border-radius:20px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{padding:14px;max-width:760px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.s small,label,.mut{color:var(--mut)}.s b{display:block;font-size:20px;margin-top:4px;font-weight:800}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.box h2{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:11px;font-family:inherit;color:var(--ink);cursor:pointer}
.tile.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
label{display:block;margin:10px 0 4px;font-size:12px}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
.hd,.row,.ch{display:flex;align-items:center;gap:10px}
.hd h2{margin:0}
.ch{justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.ch:last-child{border:0}
.b{border:0;border-radius:8px;padding:8px 12px;color:#fff;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;margin:6px 6px 0 0}
.neu{background:var(--blue)}.no{background:var(--red)}.ok{background:var(--ok)}
.empty{color:var(--mut);padding:14px 0;text-align:center}
.pill{display:inline-block;background:var(--blue);color:#fff;border-radius:20px;padding:10px 16px;font-weight:600;margin-top:6px}
.note{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;color:var(--mut)}
header h1{font-size:18px}.htl{flex:1;min-width:0}.htl small{display:block;color:var(--mut);font-size:13px}
#hr{display:flex;align-items:center;gap:6px}
.ib{position:relative;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px}
.bg{position:absolute;top:-2px;right:-4px;background:var(--blue);color:#fff;border-radius:12px;font-size:11px;font-weight:700;padding:2px 6px}
.av{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff}
.lb{width:64px;height:64px;border:1px solid var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;background:#fff;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.svc{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 18px 12px 12px;margin-bottom:12px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.gr{color:var(--ok);font-weight:600}.chev{font-size:30px;color:var(--mut)}
.cc{border-radius:26px;padding:16px}
.bal{background:linear-gradient(135deg,#1553f0,#2b7bff);color:#fff;border-radius:24px;padding:20px;margin-top:14px;min-height:180px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(21,83,240,.28)}
.fl{width:56px;height:56px;object-fit:contain;flex:none}.dpb{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.25);flex:none}
.bn{font-size:34px;font-weight:800;line-height:1.15;margin-top:6px;white-space:nowrap}.bl{font-size:13px;letter-spacing:.12em;opacity:.92}
.vm{background:none;border:0;border-bottom:2px solid rgba(255,255,255,.65);color:#fff;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;padding:0 0 2px}
.vm2{background:none;border:0;color:var(--ink);font-weight:600;font-size:15px;font-family:inherit;cursor:pointer}
.actb{background:rgba(18,128,92,.14);color:var(--ok);border:1px solid var(--ok);border-radius:20px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.trend{position:absolute;right:16px;top:16px;width:46px;height:46px;border-radius:50%;background:rgba(18,128,92,.15);color:var(--ok);display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:0;margin:12px 0 2px;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:9px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.bal{text-shadow:0 1px 8px rgba(0,0,0,.3)}
.bal.ht{background:linear-gradient(180deg,#00209F 0 56%,#D21034 56% 100%);box-shadow:0 10px 24px rgba(0,32,159,.3)}
.bal.mx{background:linear-gradient(180deg,#006847 0 52%,#fff 52% 60%,#CE1126 60% 100%);box-shadow:0 10px 24px rgba(0,104,71,.3)}
.bal.cl{background:linear-gradient(180deg,#0039A6 0 56%,#fff 56% 58.5%,#D52B1E 58.5% 100%);box-shadow:0 10px 24px rgba(0,57,166,.3)}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;padding:24px;color:#000;background:#fff}}
#mb{background:none;border:0;font-size:24px;color:var(--ink);cursor:pointer;padding:0 4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9}
.dr{position:fixed;top:0;bottom:0;left:0;width:80%;max-width:310px;background:var(--card);z-index:10;display:flex;flex-direction:column;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
.it{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:24px;border:0;background:none;color:var(--ink);font-family:inherit;font-size:15px;width:100%;text-align:left;cursor:pointer}
.it.on{background:rgba(29,79,215,.13);color:var(--blue);font-weight:600}
.sec{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;letter-spacing:.1em;font-weight:600;padding:18px 12px 6px;background:none;border:0;width:100%;font-family:inherit;cursor:pointer}
.ln{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
</style>
</head>
